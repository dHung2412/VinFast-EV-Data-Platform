services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: vinfast
      CLICKHOUSE_PASSWORD: vinfast123
      CLICKHOUSE_DB: vinfast
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: vinfast
      MINIO_ROOT_PASSWORD: vinfast123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vinfast vinfast123;
      mc mb local/vinfast-bronze --ignore-existing;
      mc mb local/vinfast-silver --ignore-existing;
      mc mb local/vinfast-gold --ignore-existing;
      echo 'Buckets created successfully.';
      "

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
      MB_PLUGINS_DIR: /plugins
    volumes:
      - ./metabase/plugins:/plugins
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy

